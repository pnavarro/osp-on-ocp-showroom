---
type: showroom

# Set the left column width to 30%
default_width: 40
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:

  # Bastion Terminal
  - name: Bastion
    path: /wetty
    port: 443

  # OpenShift Console
  - name: OpenShift Console
    url: 'https://console-openshift-console.${DOMAIN}'

  # Ansible Automation Platform Console
  - name: Ansible Automation Platform
    url: 'https://aap-aap.${DOMAIN}'

  # Vertical split terminals
  # - name: Bastion
  #   path: /wetty
  #   port: 443
  #   secondary_name: Bastion
  #   secondary_path: /wetty
  #   secondary_port: 443

