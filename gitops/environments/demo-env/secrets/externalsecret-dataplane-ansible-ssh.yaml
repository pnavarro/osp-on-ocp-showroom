apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dataplane-ansible-ssh-private-key-secret
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-secretstore
    kind: ClusterSecretStore
  target:
    name: dataplane-ansible-ssh-private-key-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dataplane-ansible-ssh-private-key-secret
